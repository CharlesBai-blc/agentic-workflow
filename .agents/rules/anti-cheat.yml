# ast-grep anti-cheat rules (zero tokens). Run by scripts/lib/gate.sh on ADDED lines only.
# TypeScript / TSX / JavaScript ------------------------------------------------
id: ts-test-skip-only
language: TypeScript
message: test skipped/focused (.skip/.only/.todo)
rule:
  any:
    - pattern: $T.skip($$$)
    - pattern: $T.only($$$)
    - pattern: $T.todo($$$)
constraints:
  T: { regex: '^(describe|it|test|suite|bench|xdescribe|xit)$' }
---
id: ts-any-type
language: TypeScript
message: new `any` type
rule: { kind: predefined_type, regex: '^any$' }
---
id: ts-suppress-comment
language: TypeScript
message: suppression or placeholder comment
rule: { kind: comment, regex: '@ts-ignore|@ts-expect-error|@ts-nocheck|eslint-disable|\bTODO\b|\bFIXME\b|\bXXX\b|\bHACK\b' }
---
id: ts-not-implemented
language: TypeScript
message: stub throw
rule: { pattern: throw new Error($M) }
constraints:
  M: { regex: '(?i)not implemented|todo|unimplemented' }
---
id: tsx-test-skip-only
language: Tsx
message: test skipped/focused (.skip/.only/.todo)
rule:
  any:
    - pattern: $T.skip($$$)
    - pattern: $T.only($$$)
    - pattern: $T.todo($$$)
constraints:
  T: { regex: '^(describe|it|test|suite|bench|xdescribe|xit)$' }
---
id: tsx-any-type
language: Tsx
message: new `any` type
rule: { kind: predefined_type, regex: '^any$' }
---
id: tsx-suppress-comment
language: Tsx
message: suppression or placeholder comment
rule: { kind: comment, regex: '@ts-ignore|@ts-expect-error|@ts-nocheck|eslint-disable|\bTODO\b|\bFIXME\b|\bXXX\b|\bHACK\b' }
---
id: js-test-skip-only
language: JavaScript
message: test skipped/focused (.skip/.only/.todo)
rule:
  any:
    - pattern: $T.skip($$$)
    - pattern: $T.only($$$)
    - pattern: $T.todo($$$)
constraints:
