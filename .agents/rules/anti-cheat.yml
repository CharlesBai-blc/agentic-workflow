---
id: js-suppress-comment
language: JavaScript
message: suppression or placeholder comment
rule: { kind: comment, regex: 'eslint-disable|\bTODO\b|\bFIXME\b|\bXXX\b|\bHACK\b' }
---
# Python ----------------------------------------------------------------------
id: py-not-implemented
language: Python
message: NotImplementedError stub
rule:
  any:
    - pattern: raise NotImplementedError($$$)
    - pattern: raise NotImplementedError
---
id: py-skip
language: Python
message: test skipped
rule:
  any:
    - pattern: pytest.mark.skip($$$)
    - pattern: pytest.mark.skip
    - pattern: pytest.mark.skipif($$$)
    - pattern: pytest.skip($$$)
    - pattern: unittest.skip($$$)
    - pattern: pytest.mark.xfail($$$)
---
id: py-suppress-comment
language: Python
message: suppression or placeholder comment
rule: { kind: comment, regex: 'type:\s*ignore|noqa|pragma:\s*no cover|\bTODO\b|\bFIXME\b|\bXXX\b|\bHACK\b' }
---
id: py-ellipsis-body
language: Python
message: placeholder function body
rule:
  pattern: |
    def $F($$$):
        ...
